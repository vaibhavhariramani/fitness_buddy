name: fitness_buddy
description: "Fitness Buddy — track your body transformation and fitness progress."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.2

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3

  # UI / data
  fl_chart: ^0.69.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  uuid: ^4.5.1

  # Exercises feature
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  path_parsing: ^1.1.0

  # Nutrition tracking
  http: ^1.2.2
  mobile_scanner: ^7.4.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Workout session
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  image_path: "assets/branding/icon_flattened.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/icon_flattened.png"
    background_color: "#2E7D32"
    theme_color: "#2E7D32"

flutter:
  uses-material-design: true
  assets:
    - assets/data/exercises.json
    - assets/branding/logo.svg
    - assets/branding/logo_mark.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Variable.ttf
          weight: 700
